[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmprov"
version = "0.1.0"
description = "Copied or computed? Provenance graphs and knowledge-diffusion metrics for multi-agent transcripts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "pyarrow>=14",
  "numpy>=1.24",
  "networkx>=3.0",
  "matplotlib>=3.7",
  "pyfixest>=0.18",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "pydantic>=2"]
hf = ["huggingface_hub>=0.20"]
dev = ["pytest>=7"]

[project.scripts]
swarmprov = "swarmprov.cli:main"

[tool.setuptools.packages.find]
include = ["swarmprov*"]
